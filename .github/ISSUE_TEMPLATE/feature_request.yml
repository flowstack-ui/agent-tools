name: Feature request
description: Propose a public delivery, skill, plugin, or MCP capability.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the need before proposing an interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Explain the public behavior and which package owns the source guidance.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and compatibility
      description: Note versioning, client compatibility, and public/private boundary implications.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing request.
          required: true
        - label: I identified the package that owns the underlying guidance.
          required: true
